<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>放生模拟器</title>
    <style>html,body{background:#0b1f22;height:100%;margin:0;overflow:hidden}#app{justify-content:center;align-items:center;display:flex;position:fixed;inset:0}canvas{width:100%;height:100%;display:block}#loader{z-index:10;justify-content:center;align-items:center;font-family:Microsoft YaHei,PingFang SC,system-ui,sans-serif;transition:opacity .9s;display:flex;position:fixed;inset:0;overflow:hidden}#loader:before{content:"";filter:blur(6px)brightness(.5)saturate(.85);background:#0b1f22 url(assets/%E5%9C%BA%E6%99%AF%E5%B8%83%E6%99%AF/%E7%BD%91%E9%A1%B5%E7%83%98%E7%84%99/static.png) 50%/cover no-repeat;position:absolute;inset:-40px}#loader:after{content:"";background:radial-gradient(#0b1f2259,#0b1f22e6 75%);position:absolute;inset:0}#loader.done{opacity:0;pointer-events:none}.loader-inner{z-index:1;flex-direction:column;align-items:center;gap:16px;width:240px;display:flex;position:relative}.loader-title{letter-spacing:.5em;text-indent:.5em;color:#f3f7ef;text-shadow:0 2px 14px #00000080;font-size:26px}.loader-track{background:#f1d08a33;border-radius:2px;width:100%;height:2px;overflow:hidden}#loader-bar{background:linear-gradient(90deg,#c9a262,#f7e2b0);width:0;height:100%;box-shadow:0 0 10px #f1d08a99}.loader-meta{color:#e9f5eeb3;font-variant-numeric:tabular-nums;justify-content:space-between;width:100%;font-size:12px;display:flex}#mode-switch{opacity:0;pointer-events:none;flex-direction:column;align-items:center;gap:10px;font-family:Microsoft YaHei,PingFang SC,system-ui,sans-serif;transition:opacity .6s;display:flex;position:fixed;bottom:22px;left:50%;transform:translate(-50%)}#mode-switch.ready{opacity:1;pointer-events:auto}#mode-caption{letter-spacing:.04em;color:#e9f5eee6;text-shadow:0 1px 8px #00000080;white-space:nowrap;font-size:13px}.mode-track{-webkit-backdrop-filter:blur(10px)saturate(1.1);background:#08181a6b;border:1px solid #e9f5ee24;border-radius:999px;gap:4px;padding:4px;display:flex;box-shadow:0 6px 24px #00000040}.mode-btn{color:#e9f5eec7;cursor:pointer;background:0 0;border:0;border-radius:999px;align-items:center;gap:7px;height:36px;padding:0 18px;font:14px/1 Microsoft YaHei,PingFang SC,system-ui,sans-serif;transition:background .25s,color .25s,box-shadow .25s;display:flex}.mode-btn:hover{color:#f3f7ef}.mode-btn[aria-pressed=true]{color:#1b2a22;background:#f1d08a;box-shadow:0 2px 10px #f1d08a59}.mode-btn:focus-visible{outline-offset:2px;outline:2px solid #f7e2b0}.mode-btn svg{flex:none;width:16px;height:16px}.icon-fish{fill:currentColor}.icon-target{fill:none;stroke:currentColor;stroke-width:1.8px;stroke-linecap:round}#sound-control{-webkit-backdrop-filter:blur(10px)saturate(1.1);background:#08181a6b;border:1px solid #e9f5ee24;border-radius:999px;align-self:stretch;align-items:center;gap:14px;height:36px;padding:0 16px;font-family:Microsoft YaHei,PingFang SC,system-ui,sans-serif;display:flex;box-shadow:0 6px 24px #00000040}.sound-label{color:#e9f5eed9;white-space:nowrap;font-size:13px;line-height:1}#sound-volume{appearance:none;cursor:pointer;background:0 0;flex:1;width:0;height:18px;margin:0}#sound-volume:focus-visible{outline:none}#sound-volume::-webkit-slider-runnable-track{background:linear-gradient(90deg, #f1d08a 0 var(--level,30%), #e9f5ee33 var(--level,30%) 100%);border-radius:2px;height:3px}#sound-volume::-webkit-slider-thumb{appearance:none;background:#f7e2b0;border:0;border-radius:50%;width:12px;height:12px;margin-top:-4.5px;box-shadow:0 0 0 3px #f1d08a38}#sound-volume::-moz-range-track{background:#e9f5ee33;border-radius:2px;height:3px}#sound-volume::-moz-range-progress{background:#f1d08a;border-radius:2px;height:3px}#sound-volume::-moz-range-thumb{background:#f7e2b0;border:0;border-radius:50%;width:12px;height:12px;box-shadow:0 0 0 3px #f1d08a38}#sound-volume:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 4px #f7e2b080}#hud{color:#cfe;pointer-events:none;white-space:pre;background:#00000059;border-radius:6px;padding:8px 12px;font:13px/1.5 system-ui,sans-serif;position:fixed;top:12px;left:12px}#panel{color:#cfe;background:#00000073;border-radius:6px;width:190px;padding:8px 12px;font:13px/1.6 system-ui,sans-serif;position:fixed;top:12px;right:12px}#panel label{display:block}#panel input[type=range]{width:100%}</style>
    <script type="module" crossorigin src="./assets/index-XVI3aVHm.js"></script>
  </head>
  <body>
    <div id="app"></div>

    <div id="loader">
      <div class="loader-inner">
        <div class="loader-title">放生模拟器</div>
        <div class="loader-track"><div id="loader-bar"></div></div>
        <div class="loader-meta"><span id="loader-text">正在铺设水面</span><span id="loader-percent">0%</span></div>
      </div>
    </div>

    <div id="mode-switch">
      <div id="mode-caption">点击水面放生一条鱼</div>
      <div class="mode-track" role="group" aria-label="点击水面的动作">
        <button type="button" class="mode-btn" data-mode="release" aria-pressed="true">
          <svg class="icon-fish" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12C6 6.8 12.5 5.6 16.8 8.9L21.5 6.2 20.1 12l1.4 5.8-4.7-2.7C12.5 18.4 6 17.2 2.5 12Z" /></svg>
          放生
        </button>
        <button type="button" class="mode-btn" data-mode="target" aria-pressed="false">
          <svg class="icon-target" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7" /><circle cx="12" cy="12" r="2.5" /><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3" /></svg>
          设置目标
        </button>
      </div>
      <div id="sound-control" role="group" aria-label="背景流水声">
        <span class="sound-label" aria-hidden="true">流水声</span>
        <input type="range" id="sound-volume" aria-label="流水声音量" min="0" max="100" value="30" />
      </div>
    </div>

    <audio id="ambient-sound" src="./assets/音频/溪流白噪音.mp3" preload="none" loop></audio>
    <div id="hud" hidden>点击水面放生一条鱼</div>
    <div id="panel" hidden>
      <label><input type="checkbox" id="debug-flow" /> 调试:显示流向(箭头=水流方向,黄=流速,灰=石头,棕=露出的河床)</label>
      <label>进水量(流量) <span id="inflow-value"></span><input type="range" id="inflow-rate" min="0" max="0.6" step="0.01" /></label>
      <label>流速(只改水深,0=自由出流) <span id="outlet-speed-value"></span><input type="range" id="outlet-speed" min="0" max="3" step="0.05" /></label>
      <label>入水口宽度(0=整边) <span id="inflow-width-value"></span><input type="range" id="inflow-width" min="0" max="8" step="0.1" /></label>
      <label>摩擦 <span id="friction-value"></span><input type="range" id="friction" min="0" max="0.2" step="0.01" /></label>
      <label>岸边吸波 <span id="damping-value"></span><input type="range" id="rock-damping" min="0" max="100" step="1" /></label>
      <label>水面纹理增益 <span id="gain-value"></span><input type="range" id="slope-gain" min="1" max="80" step="1" /></label>
      <label>落水强度 <span id="splash-value"></span><input type="range" id="splash-amount" min="0" max="3" step="0.05" /></label>
    </div>
  </body>
</html>
